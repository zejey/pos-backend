# Production-oriented compose (SEC-08). Run with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Differences from the dev compose: gunicorn (not runserver), no source
# bind-mount, collectstatic on boot, DEBUG off, and restart policies. Provide a
# real .env with DJANGO_SECRET_KEY, DJANGO_ALLOWED_HOSTS, CORS_ALLOWED_ORIGINS.
services:
  db:
    restart: unless-stopped

  web:
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000
             --workers ${GUNICORN_WORKERS:-3} --timeout ${GUNICORN_TIMEOUT:-60}"
    restart: unless-stopped
    volumes: []  # no source bind-mount in production; use the baked image
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set a strong secret key}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set allowed hosts}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set frontend origins}
